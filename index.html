<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Milk Venture - Driver Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .rtl { direction: rtl; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <!-- Top Navbar -->
    <nav class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-truck-fast text-2xl"></i>
                <span class="font-bold text-xl">First Milk Driver</span>
            </div>
            <div class="flex items-center space-x-4">
                <select id="lang-switcher" onchange="switchLanguage(this.value)" class="bg-blue-700 text-white text-sm rounded px-2 py-1 border border-blue-500">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ur">اردو</option>
                    <option value="tl">Tagalog</option>
                </select>
                <button onclick="triggerSOS()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm font-bold animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> SOS
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Login View -->
        <div id="login-view" class="bg-white rounded-xl shadow-md p-6 max-w-md mx-auto mt-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center" data-i18n="login_title">Driver Portal Login</h2>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2" data-i18n="driver_key_label">Unique Driver Secret Key</label>
                    <input type="password" id="driver-key-input" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your secret key">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition" data-i18n="login_btn">Secure Login</button>
            </form>
        </div>

        <!-- Pre-Trip Inspection & Shift View (Hidden by default until login) -->
        <div id="shift-view" class="hidden space-y-6">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800" data-i18n="pretrip_title">Pre-Trip Vehicle Inspection & Clock-In</h3>
                    <span id="shift-status-badge" class="px-3 py-1 bg-yellow-100 text-yellow-800 text-sm rounded-full font-semibold">Offline</span>
                </div>
                <form id="shift-form" onsubmit="startShift(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="vehicle_plate">Vehicle Plate Number</label>
                            <input type="text" id="vehicle-plate" required class="w-full px-3 py-2 border rounded-lg" placeholder="e.g. ABC-1234">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="odometer_start">Starting Odometer (KM)</label>
                            <input type="number" id="odometer-start" required class="w-full px-3 py-2 border rounded-lg" placeholder="e.g. 45000">
                        </div>
                    </div>
                    <div class="border-t pt-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2" data-i18n="checklist_label">Mandatory Safety Checklist</label>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <label class="flex items-center space-x-2"><input type="checkbox" required class="rounded text-blue-600"> <span data-i18n="check_tires">Tires & Pressure OK</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" required class="rounded text-blue-600"> <span data-i18n="check_brakes">Brakes Functioning</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" required class="rounded text-blue-600"> <span data-i18n="check_fuel">Fuel / Battery Level Adequate</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox" required class="rounded text-blue-600"> <span data-i18n="check_cold">Cold-Chain Refrigerator Temp OK</span></label>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition" data-i18n="clock_in_btn">Start Shift & Clock-In</button>
                </form>
            </div>
        </div>

        <!-- Active Dashboard / Manifest View -->
        <div id="dashboard-view" class="hidden space-y-6">
            <!-- Header bar with shift controls -->
            <div class="bg-white rounded-xl shadow-md p-4 flex justify-between items-center">
                <div>
                    <h4 class="font-bold text-gray-800" id="driver-welcome-name">Driver Dashboard</h4>
                    <p class="text-xs text-gray-500" id="active-vehicle-info">Vehicle: -- | Shift Active</p>
                </div>
                <div class="space-x-2">
                    <button onclick="toggleBreak()" id="break-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm" data-i18n="break_btn">Take Break</button>
                    <button onclick="clockOut()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm" data-i18n="clock_out_btn">Clock Out</button>
                </div>
            </div>

            <!-- Financial & COD Reconciliation Card -->
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-xl shadow-md p-5 text-white flex justify-between items-center">
                <div>
                    <p class="text-xs uppercase tracking-wider text-blue-200" data-i18n="cod_summary_title">Daily Cash Collection (COD)</p>
                    <h3 class="text-2xl font-bold mt-1" id="total-cod-collected">SAR 0.00</h3>
                </div>
                <button onclick="openExpenseModal()" class="bg-white text-blue-700 px-3 py-2 rounded-lg text-sm font-semibold shadow hover:bg-blue-50">
                    <i class="fa-solid fa-receipt mr-1"></i> <span data-i18n="log_expense_btn">Log Expense</span>
                </button>
            </div>

            <!-- Manifest Queue -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800" data-i18n="manifest_title">Daily Delivery Manifest</h3>
                    <button onclick="loadManifest()" class="text-blue-600 hover:text-blue-800 text-sm font-semibold"><i class="fa-solid fa-rotate mr-1"></i> Refresh</button>
                </div>
                <div id="deliveries-list" class="space-y-4">
                    <!-- Populated dynamically via driver.js -->
                    <p class="text-gray-500 text-center py-6" data-i18n="loading_manifest">Loading assigned deliveries...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ePOD Modal -->
    <div id="epod-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4">
            <h3 class="text-xl font-bold text-gray-800" data-i18n="epod_title">Electronic Proof of Delivery (ePOD)</h3>
            <div id="epod-order-info" class="text-sm text-gray-600"></div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="photo_proof">Doorstep Photo Proof</label>
                <input type="file" id="epod-photo-file" accept="image/*" capture="environment" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="customer_pin">Customer Delivery PIN / OTP</label>
                <input type="text" id="epod-otp" class="w-full px-3 py-2 border rounded-lg" placeholder="Enter 4-digit code">
            </div>

            <div class="flex space-x-3 pt-2">
                <button onclick="submitEPOD('Delivered')" class="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700" data-i18n="confirm_delivery">Confirm Delivery</button>
                <button onclick="closeEPODModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400" data-i18n="cancel_btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="driver.js"></script>
</body>
</html>
